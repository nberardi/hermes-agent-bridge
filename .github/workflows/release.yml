name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require an exact version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          tag = os.environ["RELEASE_TAG"]
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          package_version = re.search(r'__version__ = "([^"]+)"', pathlib.Path("src/hermes_agent_bridge/__init__.py").read_text()).group(1)
          installer_version = re.search(r'PROJECT_VERSION="([^"]+)"', pathlib.Path("install.sh").read_text()).group(1)
          if not re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"invalid release tag: {tag}")
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag} does not match pyproject.toml {version}")
          if package_version != version or installer_version != version:
              raise SystemExit("package and installer versions must match pyproject.toml")
          PY
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . build uv
      - name: Test
        run: make ci
      - name: Build wheel and locked runtime requirements
        run: |
          python -m build --wheel
          uv export --no-dev --frozen --no-emit-project --no-header --no-annotate --output-file requirements-runtime.txt
      - name: Build release bundle and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bundle="hermes-agent-bridge-${RELEASE_TAG}"
          mkdir -p "release/${bundle}/deploy"
          cp install.sh requirements-runtime.txt dist/hermes_agent_bridge-*.whl "release/${bundle}/"
          cp deploy/compose.yaml deploy/hermes-agent-bridge.service "release/${bundle}/deploy/"
          tar -C release -czf "release/${bundle}.tar.gz" "$bundle"
          cp install.sh release/install.sh
          cd release
          sha256sum install.sh "${bundle}.tar.gz" "${bundle}"/requirements-runtime.txt "${bundle}"/*.whl > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            release/install.sh
            release/hermes-agent-bridge-*.tar.gz
            release/SHA256SUMS
          if-no-files-found: error

  # GHCR container packages default to private on first push, and GITHUB_TOKEN
  # cannot change that: /user/packages/* only accepts a personal access token
  # authenticated as the package owner, so a GITHUB_TOKEN call 404s even
  # though the package exists. Set the package to public once, manually, from
  # its GitHub settings page (Profile > Packages > hermes-agent-bridge >
  # Package settings > Change visibility); it stays public for every release
  # after that, so this is a one-time step rather than something to automate
  # here.
  image:
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an immutable version tag
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image $IMAGE" >&2
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      - name: Verify anonymous multi-architecture pull metadata
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
        run: |
          docker logout ghcr.io
          output="$(docker buildx imagetools inspect "$IMAGE")"
          grep -q 'linux/amd64' <<<"$output"
          grep -q 'linux/arm64' <<<"$output"

  publish:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/* --verify-tag --generate-notes --title "$RELEASE_TAG"
