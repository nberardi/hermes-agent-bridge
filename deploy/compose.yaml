# One compose file, one or more sites. Secrets via env file on the host, never git.
# cloudflared already runs at each site; point a public hostname at this service
# on the docker network. Do not publish BIND_PORT on the host.
#
# Container env comes from env_file (not host ${VAR:?} interpolation). Fill the
# required keys in that file before `up`; empty Access/dashboard values fail at
# process start.
services:
  hermes-agent-bridge:
    build:
      context: ..
    image: hermes-agent-bridge:local
    restart: unless-stopped
    env_file:
      - path: ${HERMES_BRIDGE_ENV:-/etc/hermes-agent-bridge.env}
        required: true
    environment:
      BIND_PORT: "8080"
    # No ports: key. Do not publish a host port. cloudflared reaches this over docker DNS.
    networks:
      - hermes
    read_only: true
    tmpfs:
      - /tmp

networks:
  hermes:
    external: true
    name: ${HERMES_DOCKER_NETWORK:-hermes}
